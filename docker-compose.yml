services:
  postgres:
    image: postgres:16-alpine
    container_name: neuroscan_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-neuroscan_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-neuroscan_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: neuroscan_redis
    restart: always
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  seaweedfs:
    image: chrislusf/seaweedfs:latest
    container_name: neuroscan_seaweedfs
    restart: always
    ports:
      - "${SEAWEEDFS_MASTER_PORT:-9333}:9333"
      - "${SEAWEEDFS_FILER_PORT:-8888}:8888"
      - "${SEAWEEDFS_S3_PORT:-8333}:8333"
    volumes:
      - seaweedfs_data:/data
    command: "server -dir=/data -s3 -s3.port=8333 -filer=true -volume.max=100"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:9333/cluster/status || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5

  seaweedfs-init:
    image: chrislusf/seaweedfs:latest
    container_name: neuroscan_seaweedfs_init
    depends_on:
      seaweedfs:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      echo 'Waiting for SeaweedFS Filer...';
      sleep 2;
      wget -q -O - --post-data='' http://seaweedfs:8888/buckets/neuroscan-scans/ || true;
      wget -q -O - --post-data='' http://seaweedfs:8888/buckets/neuroscan-masks/ || true;
      echo 'SeaweedFS buckets neuroscan-scans and neuroscan-masks initialized.';
      exit 0;
      "

  vneid-mock:
    build:
      context: ./apps/mock-vneid
      dockerfile: Dockerfile
    container_name: neuroscan_vneid_mock
    restart: unless-stopped
    ports:
      - "${VNEID_PORT:-5001}:5001"
    environment:
      PORT: 5001
      HOST: 0.0.0.0
      ISSUER: http://localhost:5001
      CLIENT_ID: ${VNEID_CLIENT_ID:-neuroscan-client}
      CLIENT_SECRET: ${VNEID_CLIENT_SECRET:-neuroscan-secret-key-123456}
      DEFAULT_REDIRECT_URI: ${VNEID_REDIRECT_URI:-http://localhost:3000/auth/callback}

  ai-worker:
    build:
      context: ./apps/worker
      dockerfile: Dockerfile
    container_name: neuroscan_ai_worker
    restart: unless-stopped
    ports:
      - "${AI_WORKER_PORT:-8000}:8000"
    environment:
      HOST: 0.0.0.0
      PORT: 8000
      DEVICE: cpu
      MODEL_WEIGHTS_PATH: weights/unet3d_final_fp32.pth
    volumes:
      - ./apps/worker:/app

volumes:
  postgres_data:
  redis_data:
  seaweedfs_data:
